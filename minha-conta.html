<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Conta - Iuridos Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="brand">
    <img src="imagens/logo.png" alt="Logotipo da Iuridos Games">
    <h1 class="logo-text">
      <span class="logo-main">Iuridos</span>
      <span class="logo-sub">Games</span>
    </h1>
  </div>

  <nav class="menu">
    <a href="index.html">Início</a>
    <a href="jogos.html">Jogos</a>
    <a href="promocoes.html">Promoções</a>
    <a href="login.html">Login</a>
    <a href="cadastro.html">Cadastro</a>
    <a href="link do wpp" target="_blank" rel="noopener">Contato</a>
  </nav>

  <div class="acoes" id="areaUsuario"></div>
</header>

<main class="conta-container">
  <h2>👤 Minha Conta</h2>

  <div class="conta-box">
    <p><strong>Nome:</strong> <span id="nomeUsuario"></span></p>
    <p><strong>Email:</strong> <span id="emailUsuario"></span></p>
  </div>

  <div class="conta-box">
    <h3>🛒 Resumo do Carrinho</h3>
    <ul id="resumoCarrinho"></ul>
    <p><strong>Total:</strong> R$ <span id="totalCarrinho">0,00</span></p>
  </div>

  <div class="conta-acoes">
    <button onclick="fazerLogout()" class="btn-logout">🚪 Sair da Conta</button>
  </div>
</main>

<script src="script.js"></script>
<script src="auth.js"></script>
<script src="minha-conta.js"></script>

</body>
</html>
